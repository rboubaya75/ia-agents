name: Test Application Deploy

on:
  workflow_dispatch:
    inputs:
      stack_path:
        description: "Terraform stack path"
        required: true
        type: choice
        options:
          - infra/environments/test
        default: infra/environments/test
      deploy_mode:
        description: "Application deployment mode"
        required: true
        type: choice
        options:
          - frontend-only
          - image-only
          - runtime-only
          - full
        default: full
      image_tag:
        description: "ECR image tag to build or deploy. Use test for an auto-generated immutable test tag."
        required: true
        type: string
        default: test
      endpoint_name:
        description: "AgentCore Runtime endpoint name"
        required: true
        type: string
        default: default
      api_base_url:
        description: "Optional API Gateway base URL override. Leave empty to use Terraform service_url."
        required: false
        type: string
        default: ""
      enforce_secure_facade:
        description: "Fail unless API Gateway, Lambda facade, Runtime, Memory and MCP Gateway outputs are present."
        required: true
        type: boolean
        default: true
      confirm_deploy:
        description: "Required to run the selected application deployment mode"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-application-deploy-${{ github.ref }}-${{ inputs.stack_path || 'infra-environments-test' }}-${{ inputs.deploy_mode || 'full' }}
  cancel-in-progress: false

env:
  DEFAULT_STACK_PATH: infra/environments/test
  TF_VERSION: "1.9.0"
  NODE_VERSION: "20"
  AWS_REGION: eu-west-3
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  DOCKERFILE_PATH: deploy-agentcore/Dockerfile
  DOCKER_BUILD_CONTEXT: deploy-agentcore
  IMAGE_PLATFORM: linux/arm64

jobs:
  test-application-deploy:
    name: Test Application Deploy Secure Facade
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/migration/secure-agentcore-v1'
    environment:
      name: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Confirm deployment
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "true" ]; then
            echo "Application deployment requires confirm_deploy=true."
            exit 1
          fi

      - name: Architecture notice
        run: |
          echo "Ingress: Browser -> API Gateway JWT -> Lambda security facade -> AgentCore Runtime IAM."
          echo "Tools: Runtime -> AgentCore Gateway MCP -> tools."
          echo "Direct browser invocation of AgentCore Runtime is not supported."

      - name: Validate inputs
        run: |
          if ! echo "${{ inputs.image_tag }}" | grep -Eq '^[A-Za-z0-9_.-]{1,128}$'; then
            echo "Invalid image_tag."
            exit 1
          fi
          if ! echo "${{ inputs.endpoint_name }}" | grep -Eq '^[A-Za-z0-9_.-]{1,64}$'; then
            echo "Invalid endpoint_name."
            exit 1
          fi
          if [ -n "${{ inputs.api_base_url }}" ] && ! echo "${{ inputs.api_base_url }}" | grep -Eq '^https://[^[:space:]]+$'; then
            echo "api_base_url must be an HTTPS URL."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: test-application-deploy-secure-facade

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Node.js
        if: inputs.deploy_mode == 'frontend-only' || inputs.deploy_mode == 'full'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deployment dependencies
        run: python3 -m pip install "boto3>=1.43.18"

      - name: Validate facade Python
        run: python3 -m py_compile infra/modules/agent_api_facade/src/lambda_function.py

      - name: Resolve stack path
        id: stack
        run: echo "path=${{ inputs.stack_path || env.DEFAULT_STACK_PATH }}" >> "$GITHUB_OUTPUT"

      - name: Terraform init and validate
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          terraform init
          terraform fmt -check -recursive
          terraform validate

      - name: Read Terraform base outputs
        id: tfout
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          mode="${{ inputs.deploy_mode }}"

          frontend_bucket_name="$(terraform output -raw frontend_bucket_name 2>/dev/null || true)"
          cloudfront_distribution_id="$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)"
          cloudfront_domain_name="$(terraform output -raw cloudfront_domain_name 2>/dev/null || true)"
          cognito_user_pool_id="$(terraform output -raw cognito_user_pool_id 2>/dev/null || true)"
          cognito_web_client_id="$(terraform output -raw cognito_web_client_id 2>/dev/null || true)"
          service_url="$(terraform output -raw service_url 2>/dev/null || true)"
          agent_invoke_url="$(terraform output -raw agent_invoke_url 2>/dev/null || true)"
          agent_runtime_invoke_url="$(terraform output -raw agent_runtime_invoke_url 2>/dev/null || true)"
          ecr_repository_url="$(terraform output -raw agentcore_ecr_repository_url 2>/dev/null || true)"
          agent_service_name="$(terraform output -raw agent_service_name 2>/dev/null || true)"
          agent_service_role_arn="$(terraform output -raw agent_service_role_arn 2>/dev/null || true)"
          agent_service_model_id="$(terraform output -raw agent_service_model_id 2>/dev/null || true)"

          resolved_api_base_url="${{ inputs.api_base_url }}"
          if [ -z "$resolved_api_base_url" ]; then
            resolved_api_base_url="$service_url"
          fi

          if [ "$mode" = "frontend-only" ] || [ "$mode" = "full" ]; then
            if [ -z "$frontend_bucket_name" ] || [ -z "$cloudfront_distribution_id" ] || [ -z "$cognito_user_pool_id" ] || [ -z "$cognito_web_client_id" ]; then
              echo "Frontend outputs are missing. Run the Terraform test stack apply first."
              exit 1
            fi
            if [ -z "$resolved_api_base_url" ]; then
              echo "API Gateway base URL is missing."
              exit 1
            fi
          fi

          if [ "$mode" = "image-only" ] || [ "$mode" = "runtime-only" ] || [ "$mode" = "full" ]; then
            if [ -z "$ecr_repository_url" ]; then
              echo "ECR output is missing. Run the Terraform test stack apply first."
              exit 1
            fi
          fi

          if [ "$mode" = "runtime-only" ] || [ "$mode" = "full" ]; then
            if [ -z "$agent_service_name" ] || [ -z "$agent_service_role_arn" ] || [ -z "$agent_service_model_id" ]; then
              echo "Runtime deployment outputs are missing."
              exit 1
            fi
          fi

          ecr_registry="${ecr_repository_url%%/*}"
          requested_image_tag="${{ inputs.image_tag }}"
          if [ "$requested_image_tag" = "test" ]; then
            resolved_image_tag="test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            resolved_image_tag="$requested_image_tag"
          fi
          sha_tag="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="${ecr_repository_url}:${resolved_image_tag}"

          {
            echo "frontend_bucket_name=$frontend_bucket_name"
            echo "cloudfront_distribution_id=$cloudfront_distribution_id"
            echo "cloudfront_domain_name=$cloudfront_domain_name"
            echo "cognito_user_pool_id=$cognito_user_pool_id"
            echo "cognito_web_client_id=$cognito_web_client_id"
            echo "resolved_api_base_url=$resolved_api_base_url"
            echo "agent_invoke_url=$agent_invoke_url"
            echo "agent_runtime_invoke_url=$agent_runtime_invoke_url"
            echo "ecr_repository_url=$ecr_repository_url"
            echo "ecr_registry=$ecr_registry"
            echo "requested_image_tag=$requested_image_tag"
            echo "resolved_image_tag=$resolved_image_tag"
            echo "image_uri=$image_uri"
            echo "sha_tag=$sha_tag"
            echo "agent_service_name=$agent_service_name"
            echo "agent_service_role_arn=$agent_service_role_arn"
            echo "agent_service_model_id=$agent_service_model_id"
          } >> "$GITHUB_OUTPUT"

      - name: Application deployment preflight
        run: |
          python3 scripts/preflight_application_deploy.py \
            --mode "${{ inputs.deploy_mode }}" \
            --requested-image-tag "${{ steps.tfout.outputs.requested_image_tag }}" \
            --resolved-image-tag "${{ steps.tfout.outputs.resolved_image_tag }}" \
            --image-platform "${{ env.IMAGE_PLATFORM }}" \
            --ecr-repository-url "${{ steps.tfout.outputs.ecr_repository_url }}" \
            --runtime-name "${{ steps.tfout.outputs.agent_service_name }}" \
            --runtime-role-arn "${{ steps.tfout.outputs.agent_service_role_arn }}" \
            --model-id "${{ steps.tfout.outputs.agent_service_model_id }}" \
            --endpoint-name "${{ inputs.endpoint_name }}" \
            --region "${{ env.AWS_REGION }}" \
            --api-base-url "${{ steps.tfout.outputs.resolved_api_base_url }}" \
            --frontend-bucket-name "${{ steps.tfout.outputs.frontend_bucket_name }}" \
            --cloudfront-distribution-id "${{ steps.tfout.outputs.cloudfront_distribution_id }}" \
            --cognito-user-pool-id "${{ steps.tfout.outputs.cognito_user_pool_id }}" \
            --cognito-web-client-id "${{ steps.tfout.outputs.cognito_web_client_id }}"

      - name: Login to ECR
        if: inputs.deploy_mode == 'image-only' || inputs.deploy_mode == 'full'
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tfout.outputs.ecr_registry }}"

      - name: Create Docker buildx builder
        if: inputs.deploy_mode == 'image-only' || inputs.deploy_mode == 'full'
        run: |
          docker buildx create --name agentcore-builder --use || docker buildx use agentcore-builder
          docker buildx inspect --bootstrap

      - name: Build and push AgentCore image
        if: inputs.deploy_mode == 'image-only' || inputs.deploy_mode == 'full'
        run: |
          docker buildx build \
            --platform "${{ env.IMAGE_PLATFORM }}" \
            --file "${{ env.DOCKERFILE_PATH }}" \
            --tag "${{ steps.tfout.outputs.ecr_repository_url }}:${{ steps.tfout.outputs.resolved_image_tag }}" \
            --tag "${{ steps.tfout.outputs.ecr_repository_url }}:${{ steps.tfout.outputs.sha_tag }}" \
            --provenance=false \
            --push \
            "${{ env.DOCKER_BUILD_CONTEXT }}"

      - name: Apply native AgentCore control plane and facade
        if: inputs.deploy_mode == 'runtime-only' || inputs.deploy_mode == 'full'
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          terraform plan \
            -lock-timeout=60s \
            -var="enable_agentcore_control_plane=true" \
            -var="agentcore_image_tag=${{ steps.tfout.outputs.resolved_image_tag }}" \
            -var="agent_runtime_endpoint_name=${{ inputs.endpoint_name }}" \
            -out=tfplan-agentcore-control-plane

          terraform apply -auto-approve -lock-timeout=120s tfplan-agentcore-control-plane

      - name: Refresh Terraform outputs
        id: tfout_after
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          service_url="$(terraform output -raw service_url 2>/dev/null || true)"
          agent_invoke_url="$(terraform output -raw agent_invoke_url 2>/dev/null || true)"
          agent_runtime_invoke_url="$(terraform output -raw agent_runtime_invoke_url 2>/dev/null || true)"
          resolved_api_base_url="${{ inputs.api_base_url }}"
          if [ -z "$resolved_api_base_url" ]; then
            resolved_api_base_url="$service_url"
          fi
          resolved_agent_invoke_url="$agent_invoke_url"
          if [ -n "${{ inputs.api_base_url }}" ]; then
            resolved_agent_invoke_url="${resolved_api_base_url%/}/agent/invoke"
          fi

          {
            echo "resolved_api_base_url=$resolved_api_base_url"
            echo "resolved_agent_invoke_url=$resolved_agent_invoke_url"
            echo "agent_runtime_invoke_url=$agent_runtime_invoke_url"
            echo "service_url=$service_url"
            echo "cloudfront_domain_name=$(terraform output -raw cloudfront_domain_name 2>/dev/null || true)"
            echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name 2>/dev/null || true)"
            echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)"
            echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id 2>/dev/null || true)"
            echo "cognito_web_client_id=$(terraform output -raw cognito_web_client_id 2>/dev/null || true)"
            echo "agentcore_gateway_mcp_url=$(terraform output -raw agentcore_gateway_mcp_url 2>/dev/null || true)"
            echo "agentcore_memory_id=$(terraform output -raw agentcore_memory_id 2>/dev/null || true)"
            echo "agent_runtime_arn=$(terraform output -raw agent_runtime_arn 2>/dev/null || true)"
            echo "facade_function_name=$(terraform output -raw agent_api_facade_function_name 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Secure facade contract gate
        if: inputs.deploy_mode != 'image-only'
        run: |
          enforce_flag=""
          if [ "${{ inputs.enforce_secure_facade }}" = "true" ]; then
            enforce_flag="--enforce"
          fi
          python3 scripts/validate_gateway_first_contract.py \
            --mode "${{ inputs.deploy_mode }}" \
            --api-base-url "${{ steps.tfout_after.outputs.resolved_api_base_url }}" \
            --agent-runtime-invoke-url "${{ steps.tfout_after.outputs.agent_runtime_invoke_url }}" \
            --agentcore-gateway-mcp-url "${{ steps.tfout_after.outputs.agentcore_gateway_mcp_url }}" \
            --agentcore-memory-id "${{ steps.tfout_after.outputs.agentcore_memory_id }}" \
            --runtime-arn "${{ steps.tfout_after.outputs.agent_runtime_arn }}" \
            --facade-function-name "${{ steps.tfout_after.outputs.facade_function_name }}" \
            $enforce_flag

      - name: Generate frontend production environment
        if: inputs.deploy_mode == 'frontend-only' || inputs.deploy_mode == 'full'
        working-directory: frontend
        run: |
          {
            echo "VITE_COGNITO_USER_POOL_ID=${{ steps.tfout_after.outputs.cognito_user_pool_id }}"
            echo "VITE_COGNITO_CLIENT_ID=${{ steps.tfout_after.outputs.cognito_web_client_id }}"
            echo "VITE_COGNITO_REGION=${{ env.AWS_REGION }}"
            echo "VITE_AGENT_INVOKE_URL=${{ steps.tfout_after.outputs.resolved_agent_invoke_url }}"
            echo "VITE_API_BASE_URL=${{ steps.tfout_after.outputs.resolved_api_base_url }}"
          } > .env.production

      - name: Install frontend dependencies
        if: inputs.deploy_mode == 'frontend-only' || inputs.deploy_mode == 'full'
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: inputs.deploy_mode == 'frontend-only' || inputs.deploy_mode == 'full'
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        if: inputs.deploy_mode == 'frontend-only' || inputs.deploy_mode == 'full'
        working-directory: frontend
        run: npm run build

      - name: Sync frontend assets to S3
        if: inputs.deploy_mode == 'frontend-only' || inputs.deploy_mode == 'full'
        working-directory: frontend
        run: aws s3 sync dist/ "s3://${{ steps.tfout_after.outputs.frontend_bucket_name }}" --delete

      - name: Invalidate CloudFront distribution
        if: inputs.deploy_mode == 'frontend-only' || inputs.deploy_mode == 'full'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tfout_after.outputs.cloudfront_distribution_id }}" \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Application deployment completed."
          echo "Mode: ${{ inputs.deploy_mode }}"
          echo "Architecture: Browser -> API Gateway JWT -> Lambda facade -> Runtime IAM"
          echo "Tools: Runtime -> AgentCore Gateway MCP -> tools"
          echo "Requested image tag: ${{ steps.tfout.outputs.requested_image_tag }}"
          echo "Resolved image tag: ${{ steps.tfout.outputs.resolved_image_tag }}"
          echo "Image: ${{ steps.tfout.outputs.image_uri }}"
          echo "Agent API URL: ${{ steps.tfout_after.outputs.resolved_agent_invoke_url }}"
          echo "AgentCore Gateway MCP URL configured: ${{ steps.tfout_after.outputs.agentcore_gateway_mcp_url != '' }}"
          echo "AgentCore Memory ID configured: ${{ steps.tfout_after.outputs.agentcore_memory_id != '' }}"
          echo "CloudFront: https://${{ steps.tfout_after.outputs.cloudfront_domain_name }}"
