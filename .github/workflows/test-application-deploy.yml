name: Test Application Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Required to run deployment validation"
        required: true
        type: boolean
        default: false
      deploy_mode:
        description: "Application deployment mode"
        required: true
        type: choice
        options:
          - frontend-only
          - image-only
          - runtime-only
          - full
        default: full
      activate_facade:
        description: "LEGACY fallback only. Default false. Target is API Gateway -> AgentCore Gateway -> Runtime."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gateway-first-validation:
    name: Gateway-first validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/migration/secure-agentcore-v1'
    steps:
      - name: Confirm deployment
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "true" ]; then
            echo "confirm_deploy=true is required."
            exit 1
          fi

      - name: Validate target architecture
        run: |
          echo "Target: Browser -> API Gateway -> AgentCore Gateway -> Runtime."
          echo "Tools: Runtime -> AgentCore Gateway MCP -> tools."
          if [ "${{ inputs.activate_facade }}" = "true" ]; then
            echo "Legacy Lambda Facade fallback was requested. This requires an explicit ADR approval."
            exit 1
          fi

      - name: Next implementation gate
        run: |
          echo "TODO: wire Terraform outputs for AgentCore Gateway, HTTP Runtime Target, MCP Tool Targets, Memory and Runtime."
          echo "This workflow has been neutralized to prevent accidental Lambda Facade activation."
