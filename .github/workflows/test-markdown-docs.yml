name: Test Markdown Documentation

on:
  pull_request:
    branches: ["migration/secure-agentcore-v1"]
    paths:
      - "README.md"
      - "docs/**/*.md"
      - "scripts/validate_markdown_docs.py"
      - ".github/workflows/test-markdown-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-markdown-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-contracts:
    name: Markdown Contracts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile validator
        run: python -m py_compile scripts/validate_markdown_docs.py

      - name: Validate V1 documentation
        run: |
          python scripts/validate_markdown_docs.py \
            README.md \
            docs/validation/V1-MEMORY-SECURITY-SUMMARY-FR.md \
            docs/validation/V1-MEMORY-SECURITY-TESTS-FR.md
