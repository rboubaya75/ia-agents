name: Test Markdown Documentation

on:
  push:
    branches:
      - "migration/secure-agentcore-v1"
      - "migration/secure-agentcore-v2"
    paths:
      - "README.md"
      - "docs/**/*.md"
      - "architecture/**/*.md"
      - "scripts/validate_markdown_docs.py"
      - ".github/workflows/test-markdown-docs.yml"
  pull_request:
    branches:
      - "migration/secure-agentcore-v1"
      - "migration/secure-agentcore-v2"
    paths:
      - "README.md"
      - "docs/**/*.md"
      - "architecture/**/*.md"
      - "scripts/validate_markdown_docs.py"
      - ".github/workflows/test-markdown-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-markdown-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-contracts:
    name: Markdown Contracts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile validator
        run: python -m py_compile scripts/validate_markdown_docs.py

      - name: Validate V1 documentation
        if: github.base_ref == 'migration/secure-agentcore-v1' || github.ref_name == 'migration/secure-agentcore-v1'
        run: |
          python scripts/validate_markdown_docs.py \
            README.md \
            docs/validation/V1-MEMORY-SECURITY-SUMMARY-FR.md \
            docs/validation/V1-MEMORY-SECURITY-TESTS-FR.md

      - name: Validate V2 documentation
        if: github.base_ref == 'migration/secure-agentcore-v2' || github.ref_name == 'migration/secure-agentcore-v2'
        run: |
          python scripts/validate_markdown_docs.py \
            README.md \
            architecture/README.md \
            architecture/governance/V2-CHARTER-FR.md \
            architecture/governance/V2-ROADMAP-FR.md \
            architecture/hld/HLD-Secure-AgentCore-V2-FR.md \
            architecture/hld/capability-allocation-matrix.md \
            architecture/hld/runtime-contract.md \
            architecture/lld/LLD-V2-INDEX-FR.md \
            architecture/adr/V2-ADR-BACKLOG-FR.md \
            architecture/adr/V2-ADR-001-ingress-security-boundary.md \
            architecture/adr/V2-ADR-002-fastapi-agentcore-responsibilities.md \
            architecture/adr/V2-ADR-003-rag-s3-vectors-retrieval.md \
            architecture/adr/V2-ADR-004-document-ingestion-pipeline.md \
            architecture/adr/V2-ADR-005-agents-orchestration-framework.md \
            architecture/adr/V2-ADR-006-identity-authorization-isolation.md \
            architecture/adr/V2-ADR-007-network-eks-platform.md \
            architecture/adr/V2-ADR-008-observability-distributed-context.md \
            architecture/adr/V2-ADR-009-gitlab-ci-promotion.md \
            architecture/adr/V2-ADR-010-backup-restore-rehydration.md
