name: Test Application Quality

on:
  push:
    branches: ["migration/secure-agentcore-v1"]
    paths:
      - "deploy-agentcore/**"
      - "frontend/**"
      - "infra/modules/agent_api_facade/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-application-quality.yml"
  pull_request:
    branches: ["migration/secure-agentcore-v1"]
    paths:
      - "deploy-agentcore/**"
      - "frontend/**"
      - "infra/modules/agent_api_facade/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-application-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-application-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security-contracts:
    name: Python Security Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy-agentcore/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "boto3>=1.43.18"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            infra/modules/agent_api_facade/src/lambda_function.py \
            deploy-agentcore/agents/phase_4.py \
            deploy-agentcore/lambda_function_code.py \
            scripts/preflight_application_deploy.py \
            scripts/validate_secure_facade_contract.py \
            scripts/validate_gateway_first_contract.py

      - name: Run unit security contracts
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

  frontend-quality:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
