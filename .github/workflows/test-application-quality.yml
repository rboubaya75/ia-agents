name: Test Application Quality

on:
  workflow_call:
  push:
    branches: ["migration/secure-agentcore-v1"]
    paths:
      - "deploy-agentcore/**"
      - "frontend/**"
      - "infra/modules/agent_api_facade/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-application-quality.yml"
      - ".github/workflows/test-application-deploy.yml"
  pull_request:
    branches: ["migration/secure-agentcore-v1"]
    paths:
      - "deploy-agentcore/**"
      - "frontend/**"
      - "infra/modules/agent_api_facade/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-application-quality.yml"
      - ".github/workflows/test-application-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-application-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security-contracts:
    name: Python Security Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy-agentcore/requirements.txt

      - name: Install pinned Runtime and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r deploy-agentcore/requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m py_compile \
            infra/modules/agent_api_facade/src/lambda_function.py \
            deploy-agentcore/agents/phase_4.py \
            deploy-agentcore/lambda_function_code.py \
            scripts/preflight_application_deploy.py \
            scripts/validate_secure_facade_contract.py

      - name: Verify Runtime imports
        run: |
          python - <<'PY'
          from bedrock_agentcore.memory import MemoryClient
          from bedrock_agentcore.runtime import BedrockAgentCoreApp, RequestContext
          from mcp.client.streamable_http import streamablehttp_client
          from strands import Agent
          from strands.hooks import AfterInvocationEvent, HookProvider, HookRegistry, MessageAddedEvent
          from strands.models import BedrockModel
          from strands.session import FileSessionManager
          from strands.tools.mcp.mcp_client import MCPClient
          print("Runtime imports verified")
          PY

      - name: Run unit security contracts
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Audit Python dependencies
        run: pip-audit -r deploy-agentcore/requirements.txt --strict

  frontend-quality:
    name: Frontend Lint Build and Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
