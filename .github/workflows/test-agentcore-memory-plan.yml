name: Test AgentCore Memory Plan

on:
  pull_request:
    branches: ["migration/secure-agentcore-v1"]
    paths:
      - "deploy-agentcore/requirements-deploy.txt"
      - "infra/environments/test/agentcore_native.tf"
      - "scripts/configure_agentcore_memory_strategy.py"
      - "scripts/validate_agentcore_memory_plan.py"
      - "tests/unit/test_agentcore_memory_strategy.py"
      - ".github/workflows/test-agentcore-memory-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: test-agentcore-memory-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-3
  TF_VERSION: "1.9.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACK_PATH: infra/environments/test

jobs:
  agentcore-memory-plan:
    name: AgentCore Memory Plan Contract
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy-agentcore/requirements-deploy.txt

      - name: Install pinned AgentCore control-plane SDK
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement deploy-agentcore/requirements-deploy.txt
          python -m pip check

      - name: Validate deployment SDK and Python sources
        run: |
          python -m py_compile \
            scripts/configure_agentcore_memory_strategy.py \
            scripts/validate_agentcore_memory_plan.py
          python - <<'PY'
          import boto3
          import importlib.util
          from pathlib import Path

          path = Path("scripts/configure_agentcore_memory_strategy.py")
          spec = importlib.util.spec_from_file_location("memory_strategy", path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"Unable to load {path}")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate_sdk_version()
          client = boto3.client(
              "bedrock-agentcore-control",
              region_name="eu-west-3",
              aws_access_key_id="contract",
              aws_secret_access_key="contract",
              aws_session_token="contract",
          )
          module.validate_client_contract(client)
          print("Pinned AgentCore Memory SDK contract verified")
          PY

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Generate Terraform formatting evidence
        run: |
          mkdir -p terraform-format-evidence
          terraform fmt -recursive "${STACK_PATH}"
          cp "${STACK_PATH}/agentcore_native.tf" \
            terraform-format-evidence/agentcore_native.tf
          git diff -- "${STACK_PATH}/agentcore_native.tf" \
            > terraform-format-evidence/agentcore_native.patch || true

      - name: Upload Terraform formatting evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agentcore-memory-format-${{ github.sha }}-${{ github.run_id }}
          path: terraform-format-evidence
          retention-days: 7
          if-no-files-found: error

      - name: Enforce committed Terraform formatting
        run: git diff --exit-code -- "${STACK_PATH}/agentcore_native.tf"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: test-agentcore-memory-plan

      - name: Terraform init and validate
        working-directory: ${{ env.STACK_PATH }}
        run: |
          terraform init
          terraform validate

      - name: Plan AgentCore Memory path
        id: plan
        working-directory: ${{ env.STACK_PATH }}
        run: |
          set +e
          terraform plan \
            -detailed-exitcode \
            -lock-timeout=120s \
            -var="enable_agentcore_control_plane=true" \
            -var="agentcore_image_tag=pr-${GITHUB_SHA::12}" \
            -var="agent_runtime_endpoint_name=default" \
            -out=tfplan-agentcore-memory
          exitcode=$?
          set -e

          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          if [ "$exitcode" -ne 0 ] && [ "$exitcode" -ne 2 ]; then
            echo "AgentCore Memory Terraform plan failed with exit code $exitcode."
            exit 1
          fi
          test -s tfplan-agentcore-memory

      - name: Render and validate AgentCore Memory plan
        working-directory: ${{ env.STACK_PATH }}
        run: |
          terraform show -no-color tfplan-agentcore-memory > tfplan-agentcore-memory.txt
          terraform show -json tfplan-agentcore-memory > tfplan-agentcore-memory.json
          python3 ../../../scripts/validate_agentcore_memory_plan.py \
            --plan-json tfplan-agentcore-memory.json
          python3 ../../../scripts/terraform_plan_guard.py analyze \
            --plan-json tfplan-agentcore-memory.json \
            --summary-output tfplan-agentcore-memory-summary.md \
            --policy enforce-critical
          cat tfplan-agentcore-memory-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AgentCore Memory plan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agentcore-memory-plan-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.STACK_PATH }}/tfplan-agentcore-memory
            ${{ env.STACK_PATH }}/tfplan-agentcore-memory.txt
            ${{ env.STACK_PATH }}/tfplan-agentcore-memory.json
            ${{ env.STACK_PATH }}/tfplan-agentcore-memory-summary.md
          retention-days: 14
          if-no-files-found: error
