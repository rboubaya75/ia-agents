name: Test Terraform Stack

on:
  push:
    branches:
      - "migration/secure-agentcore-v1"
      - "migration/secure-agentcore-v2"
    paths:
      - "infra/environments/test/**"
      - "infra/modules/**"
      - "scripts/terraform_plan_guard.py"
      - "tests/unit/test_terraform_plan_guard.py"
      - ".github/workflows/test-terraform-stack.yml"
      - ".gitleaksignore"
  pull_request:
    branches:
      - "migration/secure-agentcore-v1"
      - "migration/secure-agentcore-v2"
    paths:
      - "infra/environments/test/**"
      - "infra/modules/**"
      - "scripts/terraform_plan_guard.py"
      - "tests/unit/test_terraform_plan_guard.py"
      - ".github/workflows/test-terraform-stack.yml"
      - ".gitleaksignore"
  workflow_dispatch:
    inputs:
      stack_path:
        description: "Terraform stack path"
        required: true
        type: choice
        options:
          - infra/environments/test
        default: infra/environments/test
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy-plan
          - destroy
        default: plan
      confirm_destroy:
        description: "Required for destroy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-terraform-stack-${{ github.ref }}-${{ inputs.stack_path || 'infra-environments-test' }}
  cancel-in-progress: false

env:
  DEFAULT_STACK_PATH: infra/environments/test
  TF_VERSION: "1.9.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: eu-west-3
  PLAN_RETENTION_DAYS: "14"

jobs:
  secret-scan:
    name: Secret Scan Pull Request History
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for Gitleaks
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Gitleaks repository scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lockfile-check:
    name: Terraform Lockfile Check
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Resolve stack path
        id: stack
        run: echo "path=${{ inputs.stack_path || env.DEFAULT_STACK_PATH }}" >> "$GITHUB_OUTPUT"

      - name: Require Terraform provider lockfile
        run: |
          lockfile="${{ steps.stack.outputs.path }}/.terraform.lock.hcl"
          if [ ! -f "$lockfile" ]; then
            echo "Missing Terraform lockfile: $lockfile"
            echo "Generate and commit it before running this workflow:"
            echo "  cd ${{ steps.stack.outputs.path }}"
            echo "  terraform init -upgrade"
            echo "  terraform providers lock -platform=linux_amd64 -platform=darwin_amd64 -platform=darwin_arm64 -platform=windows_amd64"
            exit 1
          fi

  destroy-confirmation-check:
    name: Destroy Confirmation Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      inputs.confirm_destroy != true
    steps:
      - name: Fail when destroy is not confirmed
        run: |
          echo "action=destroy requires confirm_destroy=true."
          echo "Re-run the workflow with action=destroy and confirm_destroy checked."
          exit 1

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      # Le garde de plan est declencheur de ce workflow : une erreur de syntaxe y
      # passerait autrement inapercue jusqu'a l'etape d'analyse, apres le plan.
      - name: Compile plan guard
        run: python -m py_compile scripts/terraform_plan_guard.py

      - name: Resolve stack path
        id: stack
        run: echo "path=${{ inputs.stack_path || env.DEFAULT_STACK_PATH }}" >> "$GITHUB_OUTPUT"

      - name: Terraform fmt
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform fmt -check -recursive

      # Le pas ci-dessus part du repertoire de stack et n'atteint donc jamais
      # infra/modules. Les modules partages sont verifies explicitement.
      - name: Terraform fmt (modules partages)
        run: terraform fmt -check -recursive infra/modules

      - name: Terraform init without backend
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform validate

  terraform-plan:
    name: Terraform Plan and Safety Review
    runs-on: ubuntu-latest
    needs: terraform-validate
    # Le plan reel exige des credentials AWS et lit l'etat distant. Il reste donc
    # limite a la branche V1, ou l'infrastructure est deployee. Sur V2, la gate
    # V2-G3 demande une verification hors ligne — fmt et validate suffisent, et
    # aucun deploiement n'est autorise sans decision explicite.
    if: |
      (github.event_name == 'push' && github.ref_name == 'migration/secure-agentcore-v1') ||
      (github.event_name == 'pull_request' && github.base_ref == 'migration/secure-agentcore-v1') ||
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply'))
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: test-terraform-plan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve stack path
        id: stack
        run: echo "path=${{ inputs.stack_path || env.DEFAULT_STACK_PATH }}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          agentcore_args=()
          state_list="$(terraform state list 2>/dev/null || true)"

          if echo "$state_list" | grep -Eq '^aws_bedrockagentcore_'; then
            if ! echo "$state_list" | grep -Fq 'aws_bedrockagentcore_agent_runtime.agent[0]'; then
              echo "AgentCore resources exist in Terraform state, but the Runtime resource is missing."
              echo "Refusing to run the base Terraform plan because it could destroy or orphan AgentCore control-plane resources."
              echo "Run Test Application Deploy with deploy_mode=full to reconcile the AgentCore control plane."
              exit 1
            fi

            runtime_state="$(terraform state show -no-color 'aws_bedrockagentcore_agent_runtime.agent[0]')"
            image_uri="$(printf '%s\n' "$runtime_state" | awk -F' = ' '/container_uri/ {gsub(/"/, "", $2); print $2; exit}')"
            image_tag="${image_uri##*:}"

            if [ -z "$image_uri" ] || [ -z "$image_tag" ] || [ "$image_tag" = "$image_uri" ]; then
              echo "Unable to resolve the current AgentCore Runtime image tag from Terraform state."
              echo "Refusing to run the base Terraform plan because it could reset or destroy AgentCore resources."
              exit 1
            fi

            agentcore_args+=("-var=enable_agentcore_control_plane=true")
            agentcore_args+=("-var=agentcore_image_tag=${image_tag}")
            echo "Preserving existing AgentCore control plane with image tag: ${image_tag}"
          else
            echo "No AgentCore resources found in Terraform state; using the stack defaults."
          fi

          terraform plan -detailed-exitcode -out=tfplan -lock-timeout=60s "${agentcore_args[@]}"
        continue-on-error: true

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Render Terraform plan evidence
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Analyze Terraform plan safety
        id: plan_guard
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          python3 ../../../scripts/terraform_plan_guard.py analyze \
            --plan-json tfplan.json \
            --summary-output tfplan-summary.md \
            --policy enforce-critical
        continue-on-error: true

      - name: Record immutable plan metadata
        if: always() && (steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2')
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          python3 ../../../scripts/terraform_plan_guard.py record \
            --plan tfplan \
            --metadata-output tfplan-metadata.json \
            --commit-sha "${GITHUB_SHA}" \
            --stack-path "${{ steps.stack.outputs.path }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --terraform-version "${TF_VERSION}"

      - name: Publish plan summary
        if: always() && (steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2')
        working-directory: ${{ steps.stack.outputs.path }}
        run: cat tfplan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed plan artifact
        if: always() && (steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tfplan-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.stack.outputs.path }}/tfplan
            ${{ steps.stack.outputs.path }}/tfplan.txt
            ${{ steps.stack.outputs.path }}/tfplan.json
            ${{ steps.stack.outputs.path }}/tfplan-summary.md
            ${{ steps.stack.outputs.path }}/tfplan-metadata.json
          retention-days: 14
          if-no-files-found: error

      - name: Fail on unsafe critical changes
        if: steps.plan_guard.outcome == 'failure'
        run: |
          echo "Terraform plan contains a blocked deletion or replacement of a critical resource."
          exit 1

  terraform-apply:
    name: Terraform Apply Reviewed Plan
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'apply' &&
      github.ref == 'refs/heads/migration/secure-agentcore-v1' &&
      needs.terraform-plan.outputs.plan_exit_code == '2'
    environment:
      name: test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: test-terraform-apply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve stack path
        id: stack
        run: echo "path=${{ inputs.stack_path || env.DEFAULT_STACK_PATH }}" >> "$GITHUB_OUTPUT"

      - name: Download reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tfplan-${{ github.sha }}-${{ github.run_id }}
          path: ${{ steps.stack.outputs.path }}

      - name: Verify immutable plan artifact
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          python3 ../../../scripts/terraform_plan_guard.py verify \
            --plan tfplan \
            --metadata tfplan-metadata.json \
            --expected-commit-sha "${GITHUB_SHA}" \
            --expected-stack-path "${{ steps.stack.outputs.path }}" \
            --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-terraform-version "${TF_VERSION}"
          cat tfplan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform init
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform init

      - name: Terraform apply exact reviewed plan
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform apply -auto-approve -lock-timeout=120s tfplan

      - name: Upload errored tfstate
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: errored-tfstate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ steps.stack.outputs.path }}/errored.tfstate
          retention-days: 7
          if-no-files-found: ignore

  terraform-destroy-plan:
    name: Terraform Explicit Destroy Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: |
      github.event_name == 'workflow_dispatch' &&
      (
        inputs.action == 'destroy-plan' ||
        (inputs.action == 'destroy' && inputs.confirm_destroy == true)
      ) &&
      github.ref == 'refs/heads/migration/secure-agentcore-v1'
    permissions:
      contents: read
      id-token: write
    outputs:
      destroy_plan_exit_code: ${{ steps.destroy_plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: test-terraform-destroy-plan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve stack path
        id: stack
        run: echo "path=${{ inputs.stack_path || env.DEFAULT_STACK_PATH }}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform init

      - name: Terraform destroy plan
        id: destroy_plan
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform plan -destroy -detailed-exitcode -out=tfdestroyplan -lock-timeout=60s
        continue-on-error: true

      - name: Fail on destroy plan error
        if: steps.destroy_plan.outputs.exitcode == '1'
        run: exit 1

      - name: Render destroy plan evidence
        if: steps.destroy_plan.outputs.exitcode == '0' || steps.destroy_plan.outputs.exitcode == '2'
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          terraform show -no-color tfdestroyplan > tfdestroyplan.txt
          terraform show -json tfdestroyplan > tfdestroyplan.json
          python3 ../../../scripts/terraform_plan_guard.py analyze \
            --plan-json tfdestroyplan.json \
            --summary-output tfdestroyplan-summary.md \
            --policy report-only
          python3 ../../../scripts/terraform_plan_guard.py record \
            --plan tfdestroyplan \
            --metadata-output tfdestroyplan-metadata.json \
            --commit-sha "${GITHUB_SHA}" \
            --stack-path "${{ steps.stack.outputs.path }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --terraform-version "${TF_VERSION}"
          cat tfdestroyplan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload explicit destroy plan artifact
        if: steps.destroy_plan.outputs.exitcode == '0' || steps.destroy_plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tfdestroyplan-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.stack.outputs.path }}/tfdestroyplan
            ${{ steps.stack.outputs.path }}/tfdestroyplan.txt
            ${{ steps.stack.outputs.path }}/tfdestroyplan.json
            ${{ steps.stack.outputs.path }}/tfdestroyplan-summary.md
            ${{ steps.stack.outputs.path }}/tfdestroyplan-metadata.json
          retention-days: 14
          if-no-files-found: error

  terraform-destroy:
    name: Terraform Destroy Reviewed Plan
    runs-on: ubuntu-latest
    needs: terraform-destroy-plan
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      inputs.confirm_destroy == true &&
      github.ref == 'refs/heads/migration/secure-agentcore-v1' &&
      needs.terraform-destroy-plan.outputs.destroy_plan_exit_code == '2'
    environment:
      name: test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: test-terraform-destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve stack path
        id: stack
        run: echo "path=${{ inputs.stack_path || env.DEFAULT_STACK_PATH }}" >> "$GITHUB_OUTPUT"

      - name: Download reviewed destroy plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tfdestroyplan-${{ github.sha }}-${{ github.run_id }}
          path: ${{ steps.stack.outputs.path }}

      - name: Verify immutable destroy plan artifact
        working-directory: ${{ steps.stack.outputs.path }}
        run: |
          python3 ../../../scripts/terraform_plan_guard.py verify \
            --plan tfdestroyplan \
            --metadata tfdestroyplan-metadata.json \
            --expected-commit-sha "${GITHUB_SHA}" \
            --expected-stack-path "${{ steps.stack.outputs.path }}" \
            --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-terraform-version "${TF_VERSION}"
          cat tfdestroyplan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform init
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform init

      - name: Terraform destroy exact reviewed plan
        working-directory: ${{ steps.stack.outputs.path }}
        run: terraform apply -auto-approve -lock-timeout=120s tfdestroyplan
