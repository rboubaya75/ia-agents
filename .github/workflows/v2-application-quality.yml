name: V2 Application Quality

# Porte de qualite du chemin V2 (ECS/Fargate + FastAPI). Distincte de
# test-application-quality.yml, qui installe les dependances AgentCore Runtime du
# chemin V1 : les deux arbres de dependances n'ont rien en commun et les melanger
# ferait echouer pip check.

on:
  workflow_call:
  push:
    branches: ["migration/secure-agentcore-v2"]
    paths:
      - "app/**"
      - "agents/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/v2-application-quality.yml"
      - ".github/workflows/v2-platform-deploy.yml"
  pull_request:
    branches: ["migration/secure-agentcore-v2"]
    paths:
      - "app/**"
      - "agents/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/v2-application-quality.yml"
      - ".github/workflows/v2-platform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-application-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  fastapi-contracts:
    name: FastAPI Sources and Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # La version doit suivre celle du Dockerfile : une source qui compile en 3.12
      # mais pas dans l'image ne serait vue qu'au demarrage de la tache ECS.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install pinned FastAPI dependencies
        run: |
          python -m pip install --disable-pip-version-check -r app/requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q app agents

      # settings = Settings() est evalue a l'import : sans ces variables, app.main
      # leve avant meme la premiere requete. Les valeurs sont factices, seul le fait
      # que le graphe d'import se resolve est teste ici.
      - name: Verify application import graph
        env:
          SSE_KEEPALIVE_SECONDS: "15"
          COGNITO_ISSUER: "https://example.invalid/pool"
          COGNITO_APP_CLIENT_ID: "quality-gate"
          JWKS_CACHE_TTL_SECONDS: "300"
          JWKS_STALE_TOLERANCE_SECONDS: "3600"
          JWKS_REFRESH_MIN_INTERVAL_SECONDS: "30"
        run: |
          python - <<'PY'
          from app.main import app

          # Le schema OpenAPI et non app.routes : cette version de FastAPI y laisse les
          # routeurs inclus sous forme d'objets non aplatis, si bien qu'un parcours de
          # app.routes ne verrait que /health et /ready et validerait un contrat vide.
          paths = set(app.openapi()["paths"])
          expected = {
              "/health",
              "/ready",
              "/api/v1/conversations/{conversation_id}/messages",
              "/api/v1/operations/{operation_id}/cancel",
          }
          missing = expected - paths
          if missing:
              raise SystemExit(f"Routes absentes du contrat V2-LLD-001: {sorted(missing)}")
          print("Contrat de routes verifie:", sorted(expected))
          PY

      - name: Audit Python dependencies
        run: python -m pip_audit --strict --requirement app/requirements.txt

  frontend-quality:
    name: Frontend Lint Test Build and Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # eslint porte les gardes du §15.3 de V2-LLD-010 : interdiction de localStorage
      # et de dangerouslySetInnerHTML. Le lint est donc un controle de securite, pas
      # seulement de style.
      - name: Lint
        run: npm run lint

      # Les tests d'integration du contrat SSE sont ignores sans V2_API_URL. Ils sont
      # rejoues contre le conteneur reel par le job container-contract.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  container-contract:
    name: Container Image and SSE Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # linux/amd64 et non arm64 : la task definition ne declare pas de
      # runtime_platform, donc ECS Fargate prend le defaut LINUX/X86_64. Une image
      # arm64 serait acceptee par ECR et rejetee au demarrage de la tache.
      - name: Build image
        run: docker build --platform linux/amd64 --tag fastapi-v2:ci .

      # Les deux defauts releves en revue du lot A tenaient a des fichiers absents de
      # l'image, pas du depot : agents/ que le Dockerfile ne copiait pas, et les
      # prompts que la regle *.md du .dockerignore excluait du contexte de build.
      # Aucun test hors conteneur ne peut les voir.
      - name: Verify image payload
        run: |
          docker run --rm fastapi-v2:ci python - <<'PY'
          import pathlib

          import agents.domain.orchestrator  # noqa: F401
          import agents.adapter.stub_adapter  # noqa: F401

          prompt = pathlib.Path("/app/agents/prompts/system_v1.md")
          if not prompt.is_file():
              raise SystemExit(f"Prompt systeme absent de l'image: {prompt}")
          print("Module agents et prompts presents dans l'image")
          PY

      - name: Start container
        run: |
          docker run --detach --name fastapi-v2 --publish 8099:8000 \
            --env SSE_KEEPALIVE_SECONDS=2 \
            --env COGNITO_ISSUER=https://example.invalid/pool \
            --env COGNITO_APP_CLIENT_ID=quality-gate \
            --env JWKS_CACHE_TTL_SECONDS=300 \
            --env JWKS_STALE_TOLERANCE_SECONDS=3600 \
            --env JWKS_REFRESH_MIN_INTERVAL_SECONDS=30 \
            fastapi-v2:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1; then
              echo "Conteneur pret apres ${attempt} tentative(s)."
              exit 0
            fi
            sleep 2
          done

          echo "Le conteneur n'a pas repondu sur /health."
          docker logs fastapi-v2
          exit 1

      # Sans jeton, la route de conversation doit repondre 401 et non 422 : un 422
      # signalerait que l'en-tete Authorization est traite comme un parametre requis
      # de la requete plutot que comme une condition d'authentification.
      - name: Verify unauthenticated contract
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8099/api/v1/conversations/ci/messages \
            -H 'Content-Type: application/json' \
            --data '{"message":"bonjour"}')"
          if [ "$status" != "401" ]; then
            echo "Attendu 401 sans jeton, recu ${status}."
            exit 1
          fi

          challenge="$(curl -s -o /dev/null -D - \
            -X POST http://127.0.0.1:8099/api/v1/conversations/ci/messages \
            -H 'Content-Type: application/json' \
            --data '{"message":"bonjour"}' \
            | tr -d '\r' | awk 'tolower($1) == "www-authenticate:" {print $2}')"
          if [ "$challenge" != "Bearer" ]; then
            echo "En-tete WWW-Authenticate absent ou incorrect: '${challenge}'."
            exit 1
          fi
          echo "401 + WWW-Authenticate: Bearer verifies."

      # L'authentification est neutralisee par le point d'extension de FastAPI, comme
      # dans les tests : le harnais ne modifie aucune source de production. Il
      # s'execute a cote du conteneur, sur le meme code source.
      - name: Start unauthenticated harness
        run: |
          python -m pip install --disable-pip-version-check -r app/requirements.txt
          cat > serve_ci.py <<'PY'
          import os

          os.environ.setdefault("SSE_KEEPALIVE_SECONDS", "2")
          os.environ.setdefault("COGNITO_ISSUER", "https://example.invalid/pool")
          os.environ.setdefault("COGNITO_APP_CLIENT_ID", "quality-gate")
          os.environ.setdefault("JWKS_CACHE_TTL_SECONDS", "300")
          os.environ.setdefault("JWKS_STALE_TOLERANCE_SECONDS", "3600")
          os.environ.setdefault("JWKS_REFRESH_MIN_INTERVAL_SECONDS", "30")

          from app.deps import bearer_claims  # noqa: E402
          from app.main import app  # noqa: E402


          async def _claims() -> dict:
              return {"sub": "utilisateur-ci"}


          app.dependency_overrides[bearer_claims] = _claims
          PY
          nohup python -m uvicorn serve_ci:app --host 127.0.0.1 --port 8098 \
            > harness.log 2>&1 &

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8098/health >/dev/null 2>&1; then
              echo "Harnais pret apres ${attempt} tentative(s)."
              exit 0
            fi
            sleep 2
          done

          echo "Le harnais n'a pas repondu sur /health."
          cat harness.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Les tests unitaires du front reposent tous sur des trames SSE ecrites a la
      # main. Ce job est le seul endroit ou l'analyseur consomme ce que FastAPI
      # serialise reellement : sans lui, les deux cotes du contrat peuvent deriver.
      - name: Run front to FastAPI contract tests
        working-directory: frontend
        env:
          V2_API_URL: http://127.0.0.1:8098
        run: npx vitest run streamService.integration

      - name: Collect container logs
        if: always()
        run: |
          docker logs fastapi-v2 > container.log 2>&1 || true
          cat container.log

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v2-container-contract-${{ github.sha }}-${{ github.run_id }}
          path: |
            container.log
            harness.log
          retention-days: 7
          if-no-files-found: ignore
