name: Test Trip Tools Phase 2

on:
  pull_request:
    branches: ["migration/secure-agentcore-v1"]
    paths:
      - "deploy-agentcore/lambda_function_code.py"
      - "deploy-agentcore/lambda_function_hardened.py"
      - "deploy-agentcore/lambda_function_phase2.py"
      - "infra/environments/test/trip_tools.tf"
      - "infra/modules/trip_tools_lambda/**"
      - "scripts/run_trip_tools_phase2_validation.py"
      - "tests/unit/test_trip_tools*.py"
      - "docs/validation/V1-TRIPS-PHASE2-FR.md"
      - ".github/workflows/test-trip-tools-phase2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-trip-tools-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trip-tools-phase2:
    name: Trip Tools Isolation and Idempotency Contracts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy-agentcore/requirements.txt

      - name: Install pinned Runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement deploy-agentcore/requirements.txt
          python -m pip check

      - name: Compile Phase 2 sources
        run: |
          python -m py_compile \
            deploy-agentcore/lambda_function_code.py \
            deploy-agentcore/lambda_function_hardened.py \
            deploy-agentcore/lambda_function_phase2.py \
            scripts/run_trip_tools_phase2_validation.py \
            tests/unit/test_trip_tools_phase2.py

      - name: Run Trip Tools regression contracts
        run: |
          set -o pipefail
          python -m unittest discover \
            -s tests/unit \
            -p "test_trip_tools*.py" \
            -v 2>&1 | tee trip-tools-regression.log

      - name: Generate focused Phase 2 evidence
        run: |
          set -o pipefail
          python scripts/run_trip_tools_phase2_validation.py \
            --output trip-tools-phase2-results.json \
            2>&1 | tee trip-tools-phase2.log

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Verify Terraform formatting
        run: |
          terraform fmt -check \
            infra/environments/test/trip_tools.tf \
            infra/modules/trip_tools_lambda/main.tf \
            infra/modules/trip_tools_lambda/variables.tf

      - name: Upload Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trip-tools-phase2-${{ github.sha }}-${{ github.run_id }}
          path: |
            trip-tools-regression.log
            trip-tools-phase2.log
            trip-tools-phase2-results.json
          retention-days: 90
          if-no-files-found: error
